name: Prepare 01.01.02

on:
  push:
    branches: [release/01.01.02]
    paths:
      - maintenance/01.01.02.patch.gz.1
      - maintenance/01.01.02.patch.gz.2
      - .github/workflows/prepare-01.01.02.yml

permissions:
  contents: read

concurrency:
  group: prepare-01.01.02
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'paulkakell/BlindCrypt' && github.ref == 'refs/heads/release/01.01.02'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out reviewed base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify and apply exact reviewed patch
        run: |
          cat maintenance/01.01.02.patch.gz.1 maintenance/01.01.02.patch.gz.2 > "$RUNNER_TEMP/01.01.02.patch.gz"
          echo "e9b62a377722c02b4200f4d18cb214a689da659086407862dfff3d9aef05fc08  $RUNNER_TEMP/01.01.02.patch.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/01.01.02.patch.gz" > "$RUNNER_TEMP/01.01.02.patch"
          echo "e87f5264082768aef380889e9bb40cd134c372ed4850992a9133ee50b0e9a664  $RUNNER_TEMP/01.01.02.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/01.01.02.patch"
          git apply --index "$RUNNER_TEMP/01.01.02.patch"

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          package-manager-cache: false

      - name: Validate the locked toolchain and complete candidate
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run validate
          git diff --exit-code -- package-lock.json
          git diff --check --cached

      - name: Commit only the validated patch
        run: |
          git rm maintenance/01.01.02.patch.gz.1 maintenance/01.01.02.patch.gz.2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(01.01.02): validate TypeScript 7 integration and preserve release recovery' -m 'Refs: #2, #7, #10, #11. Snapshot PBKDF2 salt, pin the reviewed lockfile, add seven regressions, and update release documentation. Full locked-toolchain validation and npm audit completed before this commit.'

      - name: Publish the validated candidate without rewriting history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          test "$(git ls-remote origin refs/heads/release/01.01.02 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/release/01.01.02
